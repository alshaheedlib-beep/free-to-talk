plugins { id 'com.android.application' }

// Every build on GitHub gets a higher version number, so phones accept it as an update.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'ps.alshaheed.hon'
    compileSdk 35

    defaultConfig {
        applicationId 'ps.alshaheed.hon'
        minSdk 24
        targetSdk 35
        versionCode runNumber
        versionName "0.1.${runNumber}"
        // The whole app lives on the server: change the site and every installed app updates instantly.
        buildConfigField 'String', 'APP_URL', '"https://talk.alshaheed.ps/"'
        buildConfigField 'String', 'APP_HOST', '"talk.alshaheed.ps"'
    }

    signingConfigs {
        // Test key, kept in the repo so every APK has the same signature and installs over the previous one.
        // Before Google Play we switch to a private upload key stored as a GitHub secret.
        test {
            storeFile file('../hon-test.keystore')
            storePassword 'hon-test'
            keyAlias 'hon'
            keyPassword 'hon-test'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
        debug { signingConfig signingConfigs.test }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

# Builds the هون Android app and publishes it as a GitHub release.
# Testers always get the newest build from https://talk.alshaheed.ps/android
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk hon.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: هون أندرويد — نسخة ${{ github.run_number }}
          body: |
            نسخة تجريبية من تطبيق هون لأندرويد.
            رابط التنزيل الدائم: https://talk.alshaheed.ps/android
          files: hon.apk
          make_latest: true

# Builds the هون Android app and publishes it as a GitHub release.
# Testers always get the newest build from https://talk.alshaheed.ps/android
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk hon.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: هون أندرويد — نسخة ${{ github.run_number }}
          body: |
            نسخة تجريبية من تطبيق هون لأندرويد.
            رابط التنزيل الدائم: https://talk.alshaheed.ps/android
          files: hon.apk
          make_latest: true

      # Try the app on an Android emulator and attach screenshots to the same release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/emulator-test.sh

      - uses: softprops/action-gh-release@v2
        if: always() && hashFiles('hon.apk') != ''
        with:
          tag_name: android-v${{ github.run_number }}
          files: |
            shots/*.png
            shots/logcat.txt
